# Local development: PostgreSQL 16 for the app database (alternative to the portable install).
# The app service is added in Phase 11.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legacy-dev-only}
      POSTGRES_DB: legacy_viewer
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacy -d legacy_viewer"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
