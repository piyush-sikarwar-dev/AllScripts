{# Pre-2010 chart: tab bar + the active tab. Tabs are real links (full page) enhanced with HTMX. #}
<div id="chart-tabs" class="chart-tabs">
  <div class="tabs" role="tablist" aria-label="Pre-2010 chart sections">
    {% for name, label in tabs %}
    {% set is_active = name == tab %}
    <a role="tab" id="tab-{{ name }}" class="tab{% if is_active %} tab--active{% endif %}"
       aria-selected="{{ 'true' if is_active else 'false' }}" aria-controls="tab-panel"
       href="{{ url_with('/legacy/' ~ key, {'tab': None if name == 'overview' else name}) }}"
       hx-get="/legacy/{{ key }}/tab/{{ name }}" hx-target="#chart-tabs" hx-swap="outerHTML"
       {%- if is_active and partial %} data-focus-on-load{% endif %}>{{ label }}</a>
    {% endfor %}
  </div>
  <section id="tab-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-{{ tab }}">
    {% include "partials/legacy_tab_" ~ tab ~ ".html" %}
  </section>
</div>
