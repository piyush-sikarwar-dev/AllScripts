{# "Add to export" toggle for one note. A plain POST form (CSRF field) enhanced with HTMX; the
   HTMX response also refreshes the chart header's export button count (out of band). #}
<form class="note-export" id="note-export-{{ note_ref }}" method="post"
      action="/patients/{{ key }}/export-selection/notes/{{ note_ref }}"
      hx-post="/patients/{{ key }}/export-selection/notes/{{ note_ref }}"
      hx-target="this" hx-swap="outerHTML">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button type="submit" class="btn btn--accent-outline{% if in_export %} btn--accent-outline-on{% endif %}"
          aria-pressed="{{ 'true' if in_export else 'false' }}">
    {%- if in_export %}Added ✓ · Remove{% else %}Add to export{% endif -%}
  </button>
</form>
{% if oob %}{% include "partials/export_button.html" %}{% endif %}
