{# Swapped into whatever region an HTMX request targeted. Never contains error details. #}
<div class="card error-card" role="alert">
  {% if status_code == 404 %}
  <p>This record could not be found in the archive.</p>
  {% else %}
  <p>This section could not be loaded. Try again in a moment.</p>
  {% endif %}
</div>
