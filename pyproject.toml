[project]
name = "legacy-viewer"
version = "0.1.0"
description = "Read-only web viewer for the retired Allscripts EHR archive."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "pyodbc>=5.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "nh3>=0.2",
    "weasyprint>=62",
    "pypdf>=4.0",
    "img2pdf>=0.5",
    "anyio>=4.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "defusedxml>=0.7",
    "tzdata>=2024.1",  # zoneinfo data on Windows
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# En dashes are intentional in display text (reference ranges, "Phases 1–3").
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs real database connections (deselect with -m 'not integration')",
]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures imported from another test module look like redefinitions.
"tests/**" = ["F811"]
