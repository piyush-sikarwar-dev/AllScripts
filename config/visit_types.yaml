# ENCOUNTER.ENC_VISITTYPE -> label + category (Visits tab "Visit type" filter):
#   office = real visits (the default list, Overview "Last visit", PDF export)
#   phone = phone encounters · lab = lab reviews · annual = annual exams · other = everything else
# Labels: Allscripts VISKD dictionary (hpsystem.DICTIONARIES_MASTER + HPSITE.DICTIONARIES_SITE),
# read 2026-10-12. Trailing comment = number of encounters with that type.
# office = DRAFT: 'the patient was seen by a clinician' (visit or in-office procedure).
# Evidence: Office Visit 99.5% have diagnoses and are signed; Review / Undefined 0% / 0%.
# Everything stays visible under 'All entries'. Edit a category to move a type between filters.
