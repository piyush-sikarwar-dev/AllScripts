# Used when a dictionary cannot be read from hpsystem.DICTIONARIES_MASTER / HPSITE.DICTIONARIES_SITE.
# kind -> {code: label}. Unknown codes render as "Unknown (code N)".
# TODO: replace with the real Allscripts codes once the dictionaries are identified.
sex:
  # From the Allscripts SEX dictionary (hpsystem.DICTIONARIES_MASTER, read 2026-10-12).
  0: Undefined
  1: Female
  2: Male
  3: Other
  F: Female    # fake data
  M: Male      # fake data
  U: Unknown   # fake data
marital_status: {}
language: {}
patient_status: {}
# Problem / allergy / medication-history activity (DXACT dictionary).
hx_activity: {0: "—", 1: Active, 2: Inactive, 3: Resolved, 8: Erroneous Entry, 9: Undefined}
hx_med_activity: {0: "—", 1: Active, 2: Inactive, 3: Resolved, 8: Erroneous Entry, 9: Undefined}
# HX_DIAGNOSIS acuity (DXACU) and significance (DXSIG); 0 = "*" and 9 = Undefined are not shown.
# Read 2026-10-13: acuity 0 = 256,773 rows, 9 = 2,918, 2 = 2; significance 0 = 249,272, 9 = 10,407.
hx_acuity: {0: "—", 1: Acute, 2: Chronic, 9: Undefined}
hx_significance: {0: "—", 1: Major, 2: Minor, 3: Moderate, 4: Reported, 5: Not Reported, 6: HIV-Related, 9: Undefined}
